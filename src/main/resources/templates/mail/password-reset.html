<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f9;padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="520" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background:#667eea;color:#ffffff;padding:20px 28px;font-size:18px;font-weight:bold;">
                        ✈ Flight Booking
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;color:#333333;font-size:14px;line-height:1.7;">
                        <p style="margin:0 0 12px;font-size:16px;font-weight:bold;">비밀번호 재설정 안내</p>
                        <p style="margin:0 0 20px;">
                            <span th:text="${name}">회원</span>님, 비밀번호 재설정 요청이 접수되었습니다.<br>
                            아래 버튼을 눌러 새 비밀번호를 설정해주세요.
                        </p>
                        <p style="margin:0 0 24px;text-align:center;">
                            <a th:href="${resetUrl}" href="#"
                               style="display:inline-block;background:#667eea;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:6px;font-weight:bold;">
                                비밀번호 재설정
                            </a>
                        </p>
                        <p style="margin:0;color:#888888;font-size:12px;">
                            이 링크는 <span th:text="${expireMinutes}">30</span>분 동안 한 번만 사용할 수 있습니다.<br>
                            본인이 요청하지 않았다면 이 메일을 무시해주세요. 비밀번호는 변경되지 않습니다.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
