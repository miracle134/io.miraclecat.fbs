<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/member/default-layout}">
<!--      layout:decorator="layouts/default">-->

<!-- 페이지의 개별적인 head css, script-->
<th:block layout:fragment="headScript">
</th:block>

<!-- 페이지의 개별적인 css, script -->
<!--/*@thymesVar id="manifest" type=""*/-->
<!--/*@thymesVar id="assetHost" type=""*/-->
<th:block layout:fragment="bodyScript">
    <th:block th:with="ep=${(manifest['entrypoints'] != null ? manifest['entrypoints']['member/main'] : null)}">
        <th:block th:if="${ ep != null }">
            <th:block th:each="src : ${ ep }">
                <script type="module" th:src="${ assetHost + src }"></script>
            </th:block>
        </th:block>
    </th:block>
</th:block>

<!-- 페이지의 개별적인 dialog -->
<th:block layout:fragment="bodyDialog">
</th:block>

<!-- 페이지 content -->
<th:block layout:fragment="content">
    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container text-center">
            <h1 class="display-4 fw-bold mb-3">
                <i class="bi bi-airplane-engines"></i> 항공권 예약
            </h1>
            <p class="lead mb-0">최저가 항공권을 빠르고 쉽게 찾아보세요</p>
        </div>
    </section>

    <!-- Search Card -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card search-card shadow-lg border-0">
                    <div class="card-body p-4">
                        <form id="searchForm">
                            <div class="row g-3">
                                <!-- 출발지 -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-geo-alt-fill text-primary me-1"></i>출발지
                                    </label>
                                    <select class="form-select form-select-lg" id="departureAirport" required>
                                        <option value="">공항을 선택하세요</option>
                                        <option value="ICN">인천</option>
                                        <option value="GMP">김포</option>
                                        <option value="CJU">제주</option>
                                        <option value="PUS">김해</option>
                                        <option value="KWJ">광주</option>
                                        <option value="RSU">여수</option>
                                        <option value="USN">울산</option>
                                    </select>
                                </div>

                                <!-- 도착지 -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-geo-fill text-danger me-1"></i>도착지
                                    </label>
                                    <select class="form-select form-select-lg" id="arrivalAirport" required>
                                        <option value="">공항을 선택하세요</option>
                                        <option value="ICN">인천</option>
                                        <option value="GMP">김포</option>
                                        <option value="CJU">제주</option>
                                        <option value="PUS">김해</option>
                                        <option value="KWJ">광주</option>
                                        <option value="RSU">여수</option>
                                        <option value="USN">울산</option>
                                    </select>
                                </div>

                                <!-- 출발일 -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-calendar-event text-success me-1"></i>출발일
                                    </label>
                                    <input type="date" class="form-control form-control-lg" id="departureDate" required>
                                </div>

                                <!-- 승객 수 -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">
                                        <i class="bi bi-people-fill text-info me-1"></i>승객 수
                                    </label>
                                    <select class="form-select form-select-lg" id="passengerCount" required>
                                        <option value="1" selected>1명</option>
                                        <option value="2">2명</option>
                                        <option value="3">3명</option>
                                        <option value="4">4명</option>
                                        <option value="5">5명</option>
                                        <option value="6">6명</option>
                                        <option value="7">7명</option>
                                        <option value="8">8명</option>
                                        <option value="9">9명</option>
                                    </select>
                                </div>

                                <!-- 검색 버튼 -->
                                <div class="col-12">
                                    <button type="button" class="btn btn-primary btn-lg w-100 py-3" id="btnSearch">
                                        <i class="bi bi-search me-2"></i>항공편 검색하기
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Popular Routes Section -->
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h2 class="fw-bold mb-2">
                    <i class="bi bi-star-fill text-warning"></i> 인기 노선
                </h2>
                <p class="text-muted">많은 분들이 찾으시는 인기 항공편을 확인해보세요</p>
            </div>
        </div>

        <div class="row g-4">
            <!-- Route 1 -->
            <div class="col-md-4">
                <div class="card route-card h-100" data-departure="ICN" data-arrival="CJU">
                    <div class="card-body text-center p-4">
                        <div class="route-icon mb-3">
                            <i class="bi bi-airplane-fill"></i>
                        </div>
                        <h5 class="card-title fw-bold mb-3">서울 → 제주</h5>
                        <div class="d-flex justify-content-center align-items-center mb-3">
                            <span class="badge bg-light text-dark me-2">ICN</span>
                            <i class="bi bi-arrow-right text-muted"></i>
                            <span class="badge bg-light text-dark ms-2">CJU</span>
                        </div>
                        <div class="text-primary fw-bold fs-4">50,000원~</div>
                        <small class="text-muted">최저가</small>
                    </div>
                </div>
            </div>

            <!-- Route 2 -->
            <div class="col-md-4">
                <div class="card route-card h-100" data-departure="ICN" data-arrival="PUS">
                    <div class="card-body text-center p-4">
                        <div class="route-icon mb-3">
                            <i class="bi bi-airplane-fill"></i>
                        </div>
                        <h5 class="card-title fw-bold mb-3">서울 → 부산</h5>
                        <div class="d-flex justify-content-center align-items-center mb-3">
                            <span class="badge bg-light text-dark me-2">ICN</span>
                            <i class="bi bi-arrow-right text-muted"></i>
                            <span class="badge bg-light text-dark ms-2">PUS</span>
                        </div>
                        <div class="text-primary fw-bold fs-4">41,000원~</div>
                        <small class="text-muted">최저가</small>
                    </div>
                </div>
            </div>

            <!-- Route 3 -->
            <div class="col-md-4">
                <div class="card route-card h-100" data-departure="GMP" data-arrival="CJU">
                    <div class="card-body text-center p-4">
                        <div class="route-icon mb-3">
                            <i class="bi bi-airplane-fill"></i>
                        </div>
                        <h5 class="card-title fw-bold mb-3">김포 → 제주</h5>
                        <div class="d-flex justify-content-center align-items-center mb-3">
                            <span class="badge bg-light text-dark me-2">GMP</span>
                            <i class="bi bi-arrow-right text-muted"></i>
                            <span class="badge bg-light text-dark ms-2">CJU</span>
                        </div>
                        <div class="text-primary fw-bold fs-4">42,000원~</div>
                        <small class="text-muted">최저가</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Features Section -->
    <div class="container mt-5">
        <div class="row g-4">
            <div class="col-md-4 text-center">
                <div class="mb-3">
                    <i class="bi bi-lightning-charge-fill text-warning" style="font-size: 3rem;"></i>
                </div>
                <h5 class="fw-bold">빠른 예약</h5>
                <p class="text-muted">간편한 검색으로 3분 안에<br>항공권 예약 완료</p>
            </div>
            <div class="col-md-4 text-center">
                <div class="mb-3">
                    <i class="bi bi-shield-check text-success" style="font-size: 3rem;"></i>
                </div>
                <h5 class="fw-bold">안전한 결제</h5>
                <p class="text-muted">토스페이먼츠 연동으로<br>안전한 결제 보장</p>
            </div>
            <div class="col-md-4 text-center">
                <div class="mb-3">
                    <i class="bi bi-headset text-info" style="font-size: 3rem;"></i>
                </div>
                <h5 class="fw-bold">24시간 고객지원</h5>
                <p class="text-muted">언제든지 문의하세요<br>친절하게 도와드립니다</p>
            </div>
        </div>
    </div>
</th:block>

</html>
