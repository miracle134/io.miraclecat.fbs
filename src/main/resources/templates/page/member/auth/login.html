<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/member/default-layout}">

<!-- 페이지의 개별적인 script -->
<!--/*@thymesVar id="buildStamp" type=""*/-->
<!--/*@thymesVar id="manifest" type=""*/-->
<th:block layout:fragment="bodyScript">
	<th:block th:with="ep=${(manifest['entrypoints'] != null ? manifest['entrypoints']['member/auth/login'] : null)}">
		<th:block th:if="${ep != null}">
			<th:block th:each="src : ${ep}">
				<script type="module" th:src="${assetHost + src}"></script>
			</th:block>
		</th:block>
	</th:block>
</th:block>

<!-- 페이지의 개별적인 dialog -->
<th:block layout:fragment="bodyDialog">

    <!-- 비밀번호 찾기 -->
    <div class="pm-modal" id="popForgotPassword" aria-hidden="true">
        <div class="pm-modal__content" role="dialog" aria-modal="true" tabindex="-1">
            <div class="pm-modal__header">
                <h5 class="pm-modal__title"><i class="bi bi-key me-2"></i>비밀번호 찾기</h5>
                <button type="button" class="pm-modal__close" data-pm-close aria-label="닫기">&times;</button>
            </div>
            <div class="pm-modal__body">
                <p class="small text-muted mb-3">
                    가입한 이메일을 입력하면 비밀번호 재설정 링크를 보내드립니다.<br>
                    링크는 30분 동안 한 번만 사용할 수 있습니다.
                </p>
                <label for="forgotEmail" class="form-label fw-semibold">이메일</label>
                <input type="email" class="form-control" id="forgotEmail" placeholder="example@email.com" autocomplete="off">
            </div>
            <div class="pm-modal__footer">
                <button type="button" class="pm-btn pm-btn--secondary" data-pm-close>닫기</button>
                <button type="button" class="pm-btn pm-btn--primary" id="btnSendResetMail">
                    <i class="bi bi-envelope me-1"></i>메일 보내기
                </button>
            </div>
        </div>
    </div>
</th:block>

<!-- 페이지 content -->
<th:block layout:fragment="content">
    <!-- Page Header -->
    <div class="page-header">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-2">
                <i class="bi bi-box-arrow-in-right"></i> 로그인
            </h1>
            <p class="lead mb-0">항공권 예약을 위해 로그인해주세요</p>
        </div>
    </div>

    <!-- Login Form -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card form-card">
                    <div class="card-body p-4">
                        <form id="loginForm">
                            <!-- 이메일 -->
                            <div class="mb-3">
                                <label for="loginId" class="form-label fw-semibold">
                                    <i class="bi bi-envelope-fill text-primary me-1"></i>아이디
                                </label>
                                <input type="text" class="form-control form-control-lg"
                                       id="loginId" name="loginId" autocomplete="off"
                                       placeholder="아이디(이메일)를 입력해 주세요." required>
                            </div>

                            <!-- 비밀번호 -->
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label fw-semibold">
                                    <i class="bi bi-lock-fill text-primary me-1"></i>비밀번호
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control form-control-lg" id="loginPassword"
                                           placeholder="비밀번호를 입력하세요" required>
                                </div>
                            </div>

                            <!-- 자동 로그인 & 아이디/비밀번호 찾기 -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="idSave">
                                    <label class="form-check-label" for="idSave">
                                        아이디 저장
                                    </label>
                                </div>
                                <a href="#" class="text-decoration-none text-muted small" id="linkForgotPassword">
                                    비밀번호 찾기
                                </a>
                            </div>

                            <!-- 로그인 버튼 -->
                            <button type="button" class="btn btn-primary btn-lg w-100 py-3 mb-3" id="loginButton">
                                <i class="bi bi-box-arrow-in-right me-2"></i>로그인
                            </button>

                            <!-- 구분선 -->
                            <div class="position-relative my-4">
                                <hr>
                                <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted">또는</span>
                            </div>

                            <!-- 소셜 로그인 -->
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-outline-dark btn-lg" id="btnGoogleLogin">
                                    <i class="bi bi-google me-2"></i>Google로 계속하기
                                </button>
                            </div>

                            <!-- 회원가입 링크 -->
                            <div class="text-center mt-4">
                                <span class="text-muted">아직 회원이 아니신가요?</span>
                                <a href="/member/signup" id="signupLink" class="text-decoration-none ms-2">회원가입</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
