<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/member/default-layout}">

<!-- 페이지의 개별적인 head css, script-->
<th:block layout:fragment="headScript">
    <script th:inline="javascript">
        window.resetToken = /*[[${token}]]*/ '';
    </script>
</th:block>

<!-- 페이지의 개별적인 css, script -->
<!--/*@thymesVar id="manifest" type=""*/-->
<!--/*@thymesVar id="assetHost" type=""*/-->
<th:block layout:fragment="bodyScript">
    <th:block th:with="ep=${(manifest['entrypoints'] != null ? manifest['entrypoints']['member/auth/password-reset'] : null)}">
        <th:block th:if="${ ep != null }">
            <th:block th:each="src : ${ ep }">
                <script type="module" th:src="${ assetHost + src }"></script>
            </th:block>
        </th:block>
    </th:block>
</th:block>

<!-- 페이지의 개별적인 dialog -->
<th:block layout:fragment="bodyDialog">
</th:block>

<!-- 페이지 content -->
<th:block layout:fragment="content">
    <!-- Page Header -->
    <div class="page-header">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-2">
                <i class="bi bi-key"></i> 비밀번호 재설정
            </h1>
            <p class="lead mb-0">새 비밀번호를 설정해주세요</p>
        </div>
    </div>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card form-card">
                    <div class="card-body p-4">
                        <!-- 유효한 링크 -->
                        <form id="resetForm" onsubmit="return false;" th:if="${tokenValid}">
                            <div class="mb-3">
                                <label for="newPassword" class="form-label fw-semibold">
                                    <i class="bi bi-lock-fill text-primary me-1"></i>새 비밀번호
                                </label>
                                <input type="password" class="form-control form-control-lg" id="newPassword"
                                       placeholder="8자 이상, 영문+숫자+특수문자" autocomplete="new-password">
                            </div>
                            <div class="mb-4">
                                <label for="newPasswordConfirm" class="form-label fw-semibold">
                                    <i class="bi bi-lock-fill text-primary me-1"></i>새 비밀번호 확인
                                </label>
                                <input type="password" class="form-control form-control-lg" id="newPasswordConfirm"
                                       placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password">
                            </div>
                            <button type="button" class="btn btn-primary btn-lg w-100 py-3" id="btnResetPassword">
                                <i class="bi bi-check-circle me-2"></i>비밀번호 변경
                            </button>
                        </form>

                        <!-- 만료/사용된 링크 -->
                        <div class="text-center py-3" th:unless="${tokenValid}">
                            <i class="bi bi-exclamation-circle text-warning" style="font-size: 3rem;"></i>
                            <h5 class="fw-bold mt-3">링크가 만료되었거나 이미 사용되었습니다</h5>
                            <p class="text-muted mb-4">로그인 화면의 '비밀번호 찾기'에서 다시 요청해주세요.</p>
                            <a href="/auth/login" class="btn btn-primary">로그인으로 이동</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>
