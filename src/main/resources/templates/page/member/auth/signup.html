<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/member/default-layout}">
<!--      layout:decorator="layouts/default">-->

<!-- 페이지의 개별적인 head css, script-->
<th:block layout:fragment="headScript">
</th:block>

<!-- 페이지의 개별적인 css, script -->
<!--/*@thymesVar id="manifest" type=""*/-->
<!--/*@thymesVar id="assetHost" type=""*/-->
<th:block layout:fragment="bodyScript">
    <th:block th:with="ep=${(manifest['entrypoints'] != null ? manifest['entrypoints']['member/auth/signup'] : null)}">
        <th:block th:if="${ ep != null }">
            <th:block th:each="src : ${ ep }">
                <script type="module" th:src="${ assetHost + src }"></script>
            </th:block>
        </th:block>
    </th:block>
</th:block>

<!-- 페이지의 개별적인 dialog -->
<th:block layout:fragment="bodyDialog">
</th:block>

<!-- 페이지 content -->
<th:block layout:fragment="content">
    <!-- Page Header -->
    <div class="page-header">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-2">
                <i class="bi bi-person-plus-fill"></i> 회원가입
            </h1>
            <p class="lead mb-0">Flight Booking과 함께 여행을 시작하세요</p>
        </div>
    </div>

    <!-- Signup Form -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card form-card">
                    <div class="card-body p-4">
                        <form id="signupForm" novalidate>
                            <!-- 이메일 -->
                            <div class="mb-3">
                                <label for="loginId" class="form-label fw-semibold">
                                    <i class="bi bi-envelope-fill text-primary me-1"></i>이메일
                                </label>
                                <input type="email" class="form-control form-control-lg" id="loginId"
                                       placeholder="example@email.com" required>
                                <div class="invalid-feedback">
                                    올바른 이메일 형식을 입력해주세요.
                                </div>
                                <div class="valid-feedback">
                                    사용 가능한 이메일입니다.
                                </div>
                            </div>

                            <!-- 비밀번호 -->
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label fw-semibold">
                                    <i class="bi bi-lock-fill text-primary me-1"></i>비밀번호
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control form-control-lg" id="loginPassword"
                                           placeholder="8자 이상, 영문+숫자 조합" required>
                                </div>
                                <div class="invalid-feedback">
                                    비밀번호는 8자 이상, 영문과 숫자를 포함해야 합니다.
                                </div>
                                <div class="valid-feedback">
                                    사용 가능한 비밀번호입니다.
                                </div>
                            </div>

                            <!-- 비밀번호 확인 -->
                            <div class="mb-3">
                                <label for="passwordConfirm" class="form-label fw-semibold">
                                    <i class="bi bi-lock-fill text-primary me-1"></i>비밀번호 확인
                                </label>
                                <input type="password" class="form-control form-control-lg" id="passwordConfirm"
                                       placeholder="비밀번호를 다시 입력하세요" required>
                                <div class="invalid-feedback">
                                    비밀번호가 일치하지 않습니다.
                                </div>
                                <div class="valid-feedback">
                                    비밀번호가 일치합니다.
                                </div>
                            </div>

                            <!-- 이름 -->
                            <div class="mb-3">
                                <label for="memberName" class="form-label fw-semibold">
                                    <i class="bi bi-person-fill text-primary me-1"></i>이름
                                </label>
                                <input type="text" class="form-control form-control-lg" id="memberName"
                                       placeholder="홍길동" required>
                                <div class="invalid-feedback">
                                    이름을 입력해주세요.
                                </div>
                            </div>

                            <!-- 전화번호 -->
                            <div class="mb-4">
                                <label for="mobile" class="form-label fw-semibold">
                                    <i class="bi bi-telephone-fill text-primary me-1"></i>전화번호
                                    <span class="text-muted small fw-normal">(선택)</span>
                                </label>
                                <input type="tel" class="form-control form-control-lg" id="mobile"
                                       placeholder="010-1234-5678">
                                <div class="invalid-feedback">
                                    올바른 전화번호 형식을 입력해주세요. (010-XXXX-XXXX)
                                </div>
                            </div>

                            <!-- 약관 동의 -->
                            <div class="mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                                    <label class="form-check-label" for="agreeTerms">
                                        <a href="javascript:void(0)" class="text-decoration-none">이용약관</a> 및
                                        <a href="javascript:void(0)" class="text-decoration-none">개인정보처리방침</a>에 동의합니다
                                    </label>
                                    <div class="invalid-feedback">
                                        약관에 동의해주세요.
                                    </div>
                                </div>
                            </div>

                            <!-- 가입 버튼 -->
                            <button type="button" id="btnRegister" class="btn btn-primary btn-lg w-100 py-3 mb-3">
                                <i class="bi bi-check-circle me-2"></i>가입하기
                            </button>

                            <!-- 구분선 -->
                            <div class="position-relative my-4">
                                <hr>
                                <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted">또는</span>
                            </div>

                            <!-- 소셜 가입 -->
                            <div class="d-grid gap-2 mb-3">
                                <button type="button" class="btn btn-outline-dark btn-lg" id="btnGoogleLogin">
                                    <i class="bi bi-google me-2"></i>Google로 계속하기
                                </button>
                            </div>

                            <!-- 로그인 링크 -->
                            <div class="text-center">
                                <span class="text-muted">이미 계정이 있으신가요?</span>
                                <a href="/auth/login" id="loginLink" class="text-decoration-none ms-2">로그인</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>
