<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/member/default-layout}">
<!--      layout:decorator="layouts/default">-->

<!-- 페이지의 개별적인 head css, script-->
<!--/*@thymesVar id="buildStamp" type=""*/-->
<th:block layout:fragment="headScript">
    <link rel="stylesheet" th:href="@{/css/member/seat-select.css(t=${buildStamp})}"/>
</th:block>

<!-- 페이지의 개별적인 css, script -->
<!--/*@thymesVar id="manifest" type=""*/-->
<!--/*@thymesVar id="assetHost" type=""*/-->
<th:block layout:fragment="bodyScript">
    <th:block th:with="ep=${(manifest['entrypoints'] != null ? manifest['entrypoints']['member/mypage/mypage'] : null)}">
        <th:block th:if="${ ep != null }">
            <th:block th:each="src : ${ ep }">
                <script type="module" th:src="${ assetHost + src }"></script>
            </th:block>
        </th:block>
    </th:block>
</th:block>

<!-- 페이지의 개별적인 dialog -->
<th:block layout:fragment="bodyDialog">
    <th:block th:replace="~{/fragments/member/dialog/seat-select :: seatSelectDialog}"></th:block>

    <!-- 내 정보 수정 -->
    <div class="pm-modal" id="popEditProfile" aria-hidden="true">
        <div class="pm-modal__content" role="dialog" aria-modal="true" tabindex="-1">
            <div class="pm-modal__header">
                <h5 class="pm-modal__title"><i class="bi bi-person-gear me-2"></i>내 정보 수정</h5>
                <button type="button" class="pm-modal__close" data-pm-close aria-label="닫기">&times;</button>
            </div>
            <div class="pm-modal__body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">이메일(아이디)</label>
                    <input type="text" class="form-control" id="editLoginId" disabled>
                </div>
                <div class="mb-3">
                    <label for="editMemberName" class="form-label fw-semibold">이름</label>
                    <input type="text" class="form-control" id="editMemberName" maxlength="64">
                </div>
                <div class="mb-1">
                    <label for="editMobile" class="form-label fw-semibold">
                        전화번호 <span class="text-muted small fw-normal">(선택)</span>
                    </label>
                    <input type="tel" class="form-control" id="editMobile" placeholder="010-1234-5678" maxlength="20">
                </div>
            </div>
            <div class="pm-modal__footer">
                <button type="button" class="pm-btn pm-btn--secondary" data-pm-close>닫기</button>
                <button type="button" class="pm-btn pm-btn--primary" id="btnSaveProfile">
                    <i class="bi bi-check-circle me-1"></i>저장
                </button>
            </div>
        </div>
    </div>

    <!-- 비밀번호 변경 -->
    <div class="pm-modal" id="popMyPassword" aria-hidden="true">
        <div class="pm-modal__content" role="dialog" aria-modal="true" tabindex="-1">
            <div class="pm-modal__header">
                <h5 class="pm-modal__title"><i class="bi bi-key me-2"></i>비밀번호 변경</h5>
                <button type="button" class="pm-modal__close" data-pm-close aria-label="닫기">&times;</button>
            </div>
            <div class="pm-modal__body">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label fw-semibold">현재 비밀번호</label>
                    <input type="password" class="form-control" id="currentPassword" autocomplete="current-password">
                </div>
                <div class="mb-3">
                    <label for="myNewPassword" class="form-label fw-semibold">새 비밀번호</label>
                    <input type="password" class="form-control" id="myNewPassword"
                           placeholder="8자 이상, 영문+숫자+특수문자" autocomplete="new-password">
                </div>
                <div class="mb-1">
                    <label for="myNewPasswordConfirm" class="form-label fw-semibold">새 비밀번호 확인</label>
                    <input type="password" class="form-control" id="myNewPasswordConfirm" autocomplete="new-password">
                </div>
            </div>
            <div class="pm-modal__footer">
                <button type="button" class="pm-btn pm-btn--secondary" data-pm-close>닫기</button>
                <button type="button" class="pm-btn pm-btn--primary" id="btnSavePassword">
                    <i class="bi bi-check-circle me-1"></i>변경
                </button>
            </div>
        </div>
    </div>
</th:block>

<!-- 페이지 content -->
<th:block layout:fragment="content">
    <!-- Page Header -->
    <div class="page-header">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-2">
                <i class="bi bi-person-circle"></i> 내 예약
            </h1>
            <p class="lead mb-0">예약 내역을 확인하고 관리하세요</p>
        </div>
    </div>
    <!-- Main Content -->
    <div class="container my-4">
        <!-- 내 정보 -->
        <div class="card mb-4" id="myInfoCard">
            <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <div class="fw-bold fs-5">
                        <i class="bi bi-person-circle text-primary me-1"></i><span id="myName">-</span>
                        <span class="badge bg-light text-dark border ms-1 d-none" id="myProviderBadge">
                            <i class="bi bi-google me-1"></i>Google
                        </span>
                    </div>
                    <div class="small text-muted mt-1">
                        <i class="bi bi-envelope me-1"></i><span id="myLoginId">-</span>
                        <span class="mx-2">|</span>
                        <i class="bi bi-telephone me-1"></i><span id="myMobile">-</span>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-primary btn-sm" id="btnEditProfile">
                        <i class="bi bi-pencil me-1"></i>정보 수정
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm d-none" id="btnChangePassword">
                        <i class="bi bi-key me-1"></i>비밀번호 변경
                    </button>
                </div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <ul class="nav nav-pills mb-4 justify-content-center" id="bookingFilter">
            <li class="nav-item">
                <a class="nav-link active" href="#" data-filter="all">전체</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-filter="upcoming">예정</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-filter="completed">완료</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" data-filter="cancelled">취소</a>
            </li>
        </ul>

        <!-- Booking List -->
        <div id="bookingList"></div>

        <template id="bookingCardTemplate">
            <div class="card mb-3 booking-card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8 mb-3 mb-md-0">
                            <!-- Booking Header -->
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <span class="badge mb-2 booking-status"></span>
                                    <h5 class="mb-1 booking-route"></h5>
                                    <p class="text-muted mb-0 small">
                                        <i class="bi bi-calendar3 me-1"></i>예약번호: <span class="booking-number"></span>
                                    </p>
                                </div>
                                <div class="text-end">
                                    <div class="fw-bold fs-5 booking-amount"></div>
                                    <div class="small text-muted booking-amount-sub"></div>
                                </div>
                            </div>

                            <!-- Flight Info -->
                            <div class="border-start border-3 ps-3 mb-3 booking-flight">
                                <div class="row align-items-center">
                                    <div class="col-4">
                                        <div class="fw-bold departure-time"></div>
                                        <div class="small text-muted flight-date"></div>
                                        <div class="small departure-airport"></div>
                                    </div>
                                    <div class="col-4 text-center">
                                        <i class="bi bi-arrow-right booking-arrow"></i>
                                        <div class="small text-muted duration"></div>
                                    </div>
                                    <div class="col-4">
                                        <div class="fw-bold arrival-time"></div>
                                        <div class="small text-muted flight-date"></div>
                                        <div class="small arrival-airport"></div>
                                    </div>
                                </div>
                                <div class="mt-2">
                                    <span class="badge bg-light text-dark">
                                        <i class="bi bi-airplane me-1"></i><span class="airline"></span>
                                    </span>
                                </div>
                            </div>

                            <!-- Passenger / Cancel Info -->
                            <div class="small booking-info"></div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="col-md-4 text-md-end">
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-outline-success btn-seat-change d-none">
                                    <i class="bi bi-grid-3x3 me-1"></i>좌석 변경
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-cancel d-none">
                                    <i class="bi bi-x-circle me-1"></i>예약취소
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-completed d-none" disabled>
                                    <i class="bi bi-check-circle me-1"></i>여행완료
                                </button>
                            </div>
                            <div class="small text-muted mt-2 booking-seats"></div>
                            <div class="small text-muted booking-created"></div>
                            <div class="small text-muted booking-deadline d-none">변경·취소 가능 기간이 지났습니다</div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-5 d-none">
            <i class="bi bi-inbox display-1 text-muted"></i>
            <h4 class="mt-3 text-muted">예약 내역이 없습니다</h4>
            <p class="text-muted">새로운 여행을 계획해보세요!</p>
            <a href="/" class="btn btn-primary mt-3">
                <i class="bi bi-search me-2"></i>항공편 검색
            </a>
        </div>

        <!-- Pagination -->
        <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>

</th:block>

</html>
