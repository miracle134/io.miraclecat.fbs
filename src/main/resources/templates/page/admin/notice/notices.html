<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/admin/default-layout}">

<!-- 페이지의 개별적인 css, script -->
<!--/*@thymesVar id="manifest" type=""*/-->
<!--/*@thymesVar id="assetHost" type=""*/-->
<th:block layout:fragment="bodyScript">
    <th:block th:with="ep=${(manifest['entrypoints'] != null ? manifest['entrypoints']['admin/notice/notices'] : null)}">
        <th:block th:if="${ ep != null }">
            <th:block th:each="src : ${ ep }">
                <script type="module" th:src="${ assetHost + src }"></script>
            </th:block>
        </th:block>
    </th:block>
</th:block>

<!-- 페이지 dialog -->
<th:block layout:fragment="bodyDialog">
    <!-- 등록 / 수정 -->
    <div class="pm-modal pm-modal--lg" id="popNoticeForm" aria-hidden="true">
        <div class="pm-modal__content" role="dialog" aria-modal="true" tabindex="-1">
            <div class="pm-modal__header">
                <h5 class="pm-modal__title" id="noticeFormTitle">공지사항 등록</h5>
                <button type="button" class="pm-modal__close" data-pm-close aria-label="닫기">&times;</button>
            </div>
            <div class="pm-modal__body">
                <div class="admin-form-group">
                    <label class="admin-form-label" for="formTitle">제목 *</label>
                    <input type="text" class="admin-form-control" id="formTitle" maxlength="200"
                           placeholder="공지사항 제목을 입력하세요">
                </div>
                <div class="admin-form-group">
                    <label class="admin-form-label" for="formContent">내용 *</label>
                    <textarea class="admin-form-control" id="formContent" rows="10"
                              placeholder="공지사항 내용을 입력하세요"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="admin-form-group">
                            <label class="admin-form-label" for="formStatus">상태 *</label>
                            <select class="admin-form-control" id="formStatus">
                                <option value="published">게시중</option>
                                <option value="hidden">숨김</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6 d-flex align-items-center">
                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="formImportant">
                            <label class="form-check-label" for="formImportant">
                                <i class="bi bi-pin-angle-fill text-danger me-1"></i>중요 공지로 설정
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pm-modal__footer">
                <button type="button" class="admin-btn admin-btn-outline" data-pm-close>취소</button>
                <button type="button" class="admin-btn admin-btn-primary" id="btnSaveNotice">
                    <i class="bi bi-check-lg"></i>저장
                </button>
            </div>
        </div>
    </div>

    <!-- 상세 -->
    <div class="pm-modal pm-modal--lg" id="popNoticeDetail" aria-hidden="true">
        <div class="pm-modal__content" role="dialog" aria-modal="true" tabindex="-1">
            <div class="pm-modal__header" style="background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); color: #fff;">
                <div style="flex: 1; min-width: 0;">
                    <h5 class="pm-modal__title mb-1" style="color: #fff;">
                        <span class="admin-badge me-1 d-none" id="detailImportant"
                              style="background: rgba(255,255,255,0.9); color: #e74c3c;">중요</span>
                        <span id="detailTitle"></span>
                    </h5>
                    <div style="opacity: 0.9; font-size: 0.85rem;">
                        <span id="detailAuthor"></span> · <span id="detailDate"></span> ·
                        조회 <span id="detailViews"></span> · <span id="detailStatus"></span>
                    </div>
                </div>
                <button type="button" class="pm-modal__close" data-pm-close aria-label="닫기" style="color: #fff;">&times;</button>
            </div>
            <div class="pm-modal__body">
                <div id="detailContent" style="line-height: 1.8; color: #2c3e50; white-space: pre-wrap; min-height: 160px;"></div>
            </div>
            <div class="pm-modal__footer">
                <button type="button" class="admin-btn admin-btn-outline" id="btnEditFromDetail">
                    <i class="bi bi-pencil"></i>수정
                </button>
                <button type="button" class="admin-btn admin-btn-secondary" data-pm-close>닫기</button>
            </div>
        </div>
    </div>
</th:block>

<!-- 페이지 content -->
<th:block layout:fragment="content">
    <!-- Filters -->
    <div class="admin-card" style="margin-bottom: 1.25rem;">
        <div class="admin-card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="admin-form-label" for="filterTitle">제목</label>
                    <input type="text" class="admin-form-control" id="filterTitle" placeholder="검색">
                </div>
                <div class="col-md-2">
                    <label class="admin-form-label" for="filterAuthor">작성자</label>
                    <input type="text" class="admin-form-control" id="filterAuthor" placeholder="작성자명">
                </div>
                <div class="col-md-2">
                    <label class="admin-form-label" for="filterStartDate">시작일</label>
                    <input type="date" class="admin-form-control" id="filterStartDate">
                </div>
                <div class="col-md-2">
                    <label class="admin-form-label" for="filterEndDate">종료일</label>
                    <input type="date" class="admin-form-control" id="filterEndDate">
                </div>
                <div class="col-md-2">
                    <label class="admin-form-label" for="filterStatus">상태</label>
                    <select class="admin-form-control" id="filterStatus">
                        <option value="">전체</option>
                        <option value="published">게시중</option>
                        <option value="hidden">숨김</option>
                    </select>
                </div>
                <div class="col-md-auto ms-auto">
                    <div class="d-flex gap-2">
                        <button type="button" class="admin-btn admin-btn-primary" id="btnSearch">
                            <i class="bi bi-search"></i>검색
                        </button>
                        <button type="button" class="admin-btn admin-btn-outline" id="btnReset">
                            <i class="bi bi-arrow-clockwise"></i>초기화
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="admin-card">
        <div class="admin-card-header">
            <h5><i class="bi bi-list-ul me-2"></i>공지사항 목록
                <small class="text-muted fw-normal ms-2">총 <strong id="totalCount">0</strong>건</small>
            </h5>
            <button type="button" class="admin-btn admin-btn-primary" id="btnAddNotice">
                <i class="bi bi-plus-lg"></i>공지사항 등록
            </button>
        </div>
        <div class="admin-card-body" style="padding: 0; overflow-x: auto;">
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width: 60px;" class="text-center">No.</th>
                    <th style="width: 70px;" class="text-center">중요</th>
                    <th>제목</th>
                    <th style="width: 110px;">작성자</th>
                    <th style="width: 110px;">작성일</th>
                    <th style="width: 80px;" class="text-center">조회수</th>
                    <th style="width: 90px;">상태</th>
                    <th style="width: 160px;">액션</th>
                </tr>
                </thead>
                <tbody id="noticeTableBody"></tbody>
            </table>
            <template id="noticeRowTemplate">
                <tr>
                    <td class="text-center row-no" style="color: #7f8c8d;"></td>
                    <td class="text-center row-important"></td>
                    <td class="row-title"></td>
                    <td class="row-author"></td>
                    <td class="row-date" style="font-size: 0.8rem; color: #7f8c8d;"></td>
                    <td class="text-center row-views"></td>
                    <td><span class="admin-badge row-status"></span></td>
                    <td>
                        <button type="button" class="admin-btn admin-btn-primary admin-btn-sm btn-detail" title="보기">
                            <i class="bi bi-eye"></i>
                        </button>
                        <button type="button" class="admin-btn admin-btn-primary admin-btn-sm btn-edit" title="수정">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button type="button" class="admin-btn admin-btn-danger admin-btn-sm btn-delete" title="삭제(숨김)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            </template>
        </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center align-items-center mt-4" style="position: relative;">
        <nav aria-label="Page navigation">
            <ul class="pagination mb-0" id="pagination"></ul>
        </nav>
        <div class="d-flex align-items-center gap-2" style="position: absolute; right: 0;">
            <span style="font-size: 0.8rem; color: #7f8c8d;">페이지당</span>
            <select class="admin-form-control" id="pageSize" style="width: auto; padding: 0.375rem 0.625rem; font-size: 0.8rem;">
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="50">50</option>
            </select>
        </div>
    </div>
</th:block>

</html>
