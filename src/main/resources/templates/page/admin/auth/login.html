<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/admin/blank-layout}">

<!-- 페이지의 개별적인 css, script -->
<!--/*@thymesVar id="manifest" type=""*/-->
<!--/*@thymesVar id="assetHost" type=""*/-->
<th:block layout:fragment="bodyScript">
    <th:block th:with="ep=${(manifest['entrypoints'] != null ? manifest['entrypoints']['admin/auth/login'] : null)}">
        <th:block th:if="${ ep != null }">
            <th:block th:each="src : ${ ep }">
                <script type="module" th:src="${ assetHost + src }"></script>
            </th:block>
        </th:block>
    </th:block>
</th:block>

<!-- 페이지 content -->
<th:block layout:fragment="content">
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <div class="admin-login-icon">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h2>관리자 로그인</h2>
                <p>Flight Booking 관리 시스템</p>
            </div>

            <form id="adminLoginForm" onsubmit="return false;">
                <div class="admin-login-group">
                    <label class="admin-login-label" for="adminId">
                        <i class="bi bi-person-fill"></i>아이디
                    </label>
                    <input type="text" class="admin-login-input" id="adminId"
                           placeholder="관리자 아이디를 입력하세요" autocomplete="username">
                </div>

                <div class="admin-login-group">
                    <label class="admin-login-label" for="adminPassword">
                        <i class="bi bi-lock-fill"></i>비밀번호
                    </label>
                    <input type="password" class="admin-login-input" id="adminPassword"
                           placeholder="비밀번호를 입력하세요" autocomplete="current-password">
                </div>

                <button type="button" class="admin-login-btn" id="btnAdminLogin">
                    <i class="bi bi-box-arrow-in-right me-2"></i>로그인
                </button>
            </form>

            <div class="admin-login-divider"></div>

            <div class="admin-login-footer">
                <p class="mb-2"><i class="bi bi-info-circle"></i>관리자 계정으로만 접근 가능합니다</p>
                <a href="/"><i class="bi bi-house"></i>사용자 화면으로</a>
            </div>
        </div>
    </div>
</th:block>

</html>
