<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/admin/default-layout}">

<!-- 페이지의 개별적인 css, script -->
<!--/*@thymesVar id="manifest" type=""*/-->
<!--/*@thymesVar id="assetHost" type=""*/-->
<th:block layout:fragment="bodyScript">
    <th:block th:with="ep=${(manifest['entrypoints'] != null ? manifest['entrypoints']['admin/member/users'] : null)}">
        <th:block th:if="${ ep != null }">
            <th:block th:each="src : ${ ep }">
                <script type="module" th:src="${ assetHost + src }"></script>
            </th:block>
        </th:block>
    </th:block>
</th:block>

<!-- 페이지 dialog -->
<th:block layout:fragment="bodyDialog">
    <!-- 회원 상세 -->
    <div class="pm-modal pm-modal--lg" id="popUserDetail" aria-hidden="true">
        <div class="pm-modal__content" role="dialog" aria-modal="true" tabindex="-1">
            <div class="pm-modal__header" style="background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); color: #fff;">
                <div>
                    <h5 class="pm-modal__title mb-1" style="color: #fff;">
                        <i class="bi bi-person-circle me-2"></i><span id="detailName"></span>
                        <span class="admin-badge ms-1 d-none" id="detailGoogle"
                              style="background: rgba(255,255,255,0.9); color: #2c3e50;"><i class="bi bi-google me-1"></i>Google</span>
                    </h5>
                    <p class="mb-0" style="opacity: 0.9; font-size: 0.85rem;" id="detailEmail"></p>
                </div>
                <button type="button" class="pm-modal__close" data-pm-close aria-label="닫기" style="color: #fff;">&times;</button>
            </div>
            <div class="pm-modal__body">
                <!-- 회원 정보 -->
                <div style="background: linear-gradient(135deg, #f8f9fa 0%, #ecf0f1 100%); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem;">
                    <h6 class="admin-detail-title"><i class="bi bi-person-fill me-1"></i>회원 정보</h6>
                    <div class="row g-2">
                        <div class="col-4">
                            <div class="admin-detail-label">전화번호</div>
                            <div class="admin-detail-value" id="detailPhone"></div>
                        </div>
                        <div class="col-4">
                            <div class="admin-detail-label">가입일</div>
                            <div class="admin-detail-value" id="detailJoinDate"></div>
                        </div>
                        <div class="col-4">
                            <div class="admin-detail-label">탈퇴일</div>
                            <div class="admin-detail-value" id="detailWithdrawnAt"></div>
                        </div>
                    </div>
                </div>

                <!-- 통계 -->
                <div class="row g-2">
                    <div class="col-md-4">
                        <div style="background: linear-gradient(135deg, rgba(52, 152, 219, 0.1) 0%, rgba(52, 152, 219, 0.05) 100%); border-radius: 0.5rem; padding: 1rem; text-align: center;">
                            <div class="admin-detail-label">예약 (확정)</div>
                            <div style="font-size: 1.25rem; font-weight: 700; color: #2c3e50;"><span id="detailBookingCount"></span>건</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div style="background: linear-gradient(135deg, rgba(231, 76, 60, 0.1) 0%, rgba(231, 76, 60, 0.05) 100%); border-radius: 0.5rem; padding: 1rem; text-align: center;">
                            <div class="admin-detail-label">취소</div>
                            <div style="font-size: 1.25rem; font-weight: 700; color: #2c3e50;"><span id="detailCancelledCount"></span>건</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div style="background: linear-gradient(135deg, rgba(39, 174, 96, 0.1) 0%, rgba(39, 174, 96, 0.05) 100%); border-radius: 0.5rem; padding: 1rem; text-align: center;">
                            <div class="admin-detail-label">상태</div>
                            <span class="admin-badge" id="detailStatusBadge" style="font-size: 0.85rem; padding: 0.375rem 0.75rem;"></span>
                        </div>
                    </div>
                </div>

                <!-- 최근 예약 -->
                <div style="margin-top: 1rem; padding: 1rem; background: #f8f9fa; border-radius: 0.5rem;">
                    <h6 class="admin-detail-title">최근 예약 내역</h6>
                    <div id="detailRecentBookings" style="font-size: 0.875rem; color: #2c3e50;"></div>
                </div>
            </div>
            <div class="pm-modal__footer">
                <button type="button" class="admin-btn admin-btn-danger" id="btnStatusFromDetail">
                    <i class="bi bi-pause-circle"></i>정지
                </button>
                <button type="button" class="admin-btn admin-btn-secondary" data-pm-close>닫기</button>
            </div>
        </div>
    </div>
</th:block>

<!-- 페이지 content -->
<th:block layout:fragment="content">
    <!-- Filters -->
    <div class="admin-card" style="margin-bottom: 1.25rem;">
        <div class="admin-card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="admin-form-label" for="filterEmail">이메일</label>
                    <input type="text" class="admin-form-control" id="filterEmail" placeholder="이메일">
                </div>
                <div class="col-md-2">
                    <label class="admin-form-label" for="filterName">이름</label>
                    <input type="text" class="admin-form-control" id="filterName" placeholder="이름">
                </div>
                <div class="col-md-2">
                    <label class="admin-form-label" for="filterPhone">전화번호</label>
                    <input type="text" class="admin-form-control" id="filterPhone" placeholder="010-1234-5678">
                </div>
                <div class="col-md-2">
                    <label class="admin-form-label" for="filterJoinDate">가입일</label>
                    <input type="date" class="admin-form-control" id="filterJoinDate">
                </div>
                <div class="col-md-2">
                    <label class="admin-form-label" for="filterStatus">상태</label>
                    <select class="admin-form-control" id="filterStatus">
                        <option value="">전체</option>
                        <option value="active">활성</option>
                        <option value="suspended">정지</option>
                        <option value="withdrawn">탈퇴</option>
                    </select>
                </div>
                <div class="col-md-auto ms-auto">
                    <div class="d-flex gap-2">
                        <button type="button" class="admin-btn admin-btn-primary" id="btnSearch">
                            <i class="bi bi-search"></i>검색
                        </button>
                        <button type="button" class="admin-btn admin-btn-outline" id="btnReset">
                            <i class="bi bi-arrow-clockwise"></i>초기화
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="admin-card">
        <div class="admin-card-header">
            <h5><i class="bi bi-list-ul me-2"></i>회원 목록</h5>
            <span class="text-muted">총 <strong id="totalCount">0</strong>명</span>
        </div>
        <div class="admin-card-body" style="padding: 0; overflow-x: auto;">
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width: 60px;" class="text-center">No.</th>
                    <th>이메일</th>
                    <th style="width: 120px;">이름</th>
                    <th style="width: 140px;">전화번호</th>
                    <th style="width: 110px;">가입일</th>
                    <th style="width: 90px;" class="text-center">예약(확정)</th>
                    <th style="width: 80px;">상태</th>
                    <th class="admin-table-actions">액션</th>
                </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
            <template id="userRowTemplate">
                <tr>
                    <td class="text-center row-no" style="color: #7f8c8d;"></td>
                    <td>
                        <strong class="row-email" style="color: #3498db;"></strong>
                        <i class="bi bi-google ms-1 row-google d-none" style="color: #7f8c8d;" title="Google 연결"></i>
                    </td>
                    <td class="row-name"></td>
                    <td class="row-phone"></td>
                    <td class="row-join" style="font-size: 0.8rem; color: #7f8c8d;"></td>
                    <td class="text-center"><strong class="row-bookings"></strong></td>
                    <td><span class="admin-badge row-status"></span></td>
                    <td class="admin-table-actions">
                        <button type="button" class="admin-btn admin-btn-primary admin-btn-sm btn-detail" title="상세">
                            <i class="bi bi-eye"></i>
                        </button>
                        <button type="button" class="admin-btn admin-btn-sm btn-status"></button>
                    </td>
                </tr>
            </template>
        </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center align-items-center mt-4" style="position: relative;">
        <nav aria-label="Page navigation">
            <ul class="pagination mb-0" id="pagination"></ul>
        </nav>
        <div class="d-flex align-items-center gap-2" style="position: absolute; right: 0;">
            <span style="font-size: 0.8rem; color: #7f8c8d;">페이지당</span>
            <select class="admin-form-control" id="pageSize" style="width: auto; padding: 0.375rem 0.625rem; font-size: 0.8rem;">
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="50">50</option>
            </select>
        </div>
    </div>
</th:block>

</html>
