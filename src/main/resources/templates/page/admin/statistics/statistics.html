<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layouts/admin/default-layout}">

<!-- 페이지의 개별적인 css, script -->
<!--/*@thymesVar id="manifest" type=""*/-->
<!--/*@thymesVar id="assetHost" type=""*/-->
<th:block layout:fragment="bodyScript">
    <th:block th:with="ep=${(manifest['entrypoints'] != null ? manifest['entrypoints']['admin/statistics/statistics'] : null)}">
        <th:block th:if="${ ep != null }">
            <th:block th:each="src : ${ ep }">
                <script type="module" th:src="${ assetHost + src }"></script>
            </th:block>
        </th:block>
    </th:block>
</th:block>

<!-- 페이지 content -->
<th:block layout:fragment="content">
    <!-- Period Filter -->
    <div class="admin-card" style="margin-bottom: 1.25rem;">
        <div class="admin-card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="admin-form-label" for="periodType">기간 선택</label>
                    <select class="admin-form-control" id="periodType">
                        <option value="7">최근 7일</option>
                        <option value="30" selected>최근 30일</option>
                        <option value="90">최근 90일</option>
                        <option value="custom">직접 선택</option>
                    </select>
                </div>
                <div class="col-md-2 d-none" id="startDateGroup">
                    <label class="admin-form-label" for="startDate">시작일</label>
                    <input type="date" class="admin-form-control" id="startDate">
                </div>
                <div class="col-md-2 d-none" id="endDateGroup">
                    <label class="admin-form-label" for="endDate">종료일</label>
                    <input type="date" class="admin-form-control" id="endDate">
                </div>
                <div class="col-md-auto">
                    <button type="button" class="admin-btn admin-btn-primary" id="btnApply">
                        <i class="bi bi-search"></i> 조회
                    </button>
                </div>
                <div class="col-md-auto ms-auto">
                    <span style="font-size: 0.85rem; color: #7f8c8d;" id="periodLabel"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Cards -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem;">
        <div class="stat-card">
            <div class="stat-card-icon primary"><i class="bi bi-ticket-detailed-fill"></i></div>
            <div class="stat-card-label">총 예약</div>
            <div class="stat-card-value" id="statTotalBookings">-</div>
            <div class="stat-card-change" id="statTotalBookingsChange"></div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon success"><i class="bi bi-cash-stack"></i></div>
            <div class="stat-card-label">순매출</div>
            <div class="stat-card-value" id="statSales">-</div>
            <div class="stat-card-change" id="statSalesChange"></div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon warning"><i class="bi bi-people-fill"></i></div>
            <div class="stat-card-label">신규 회원</div>
            <div class="stat-card-value" id="statNewMembers">-</div>
            <div class="stat-card-change" id="statNewMembersChange"></div>
        </div>
        <div class="stat-card">
            <div class="stat-card-icon danger"><i class="bi bi-x-circle-fill"></i></div>
            <div class="stat-card-label">취소율</div>
            <div class="stat-card-value" id="statCancelRate">-</div>
            <div class="stat-card-change" id="statCancelRateChange"></div>
        </div>
    </div>

    <!-- Charts Row 1 -->
    <div class="row g-3" style="margin-bottom: 1.25rem;">
        <div class="col-lg-8">
            <div class="admin-card h-100" style="margin-bottom: 0;">
                <div class="admin-card-header">
                    <h5><i class="bi bi-graph-up me-2"></i>일별 예약 추이</h5>
                </div>
                <div class="admin-card-body">
                    <div style="position: relative; height: 280px;"><canvas id="bookingTrendChart"></canvas></div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="admin-card h-100" style="margin-bottom: 0;">
                <div class="admin-card-header">
                    <h5><i class="bi bi-pie-chart me-2"></i>항공사별 비율</h5>
                </div>
                <div class="admin-card-body">
                    <div style="position: relative; height: 280px;"><canvas id="airlineChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts Row 2 -->
    <div class="row g-3" style="margin-bottom: 1.25rem;">
        <div class="col-lg-6">
            <div class="admin-card h-100" style="margin-bottom: 0;">
                <div class="admin-card-header">
                    <h5><i class="bi bi-trophy me-2"></i>인기 노선 Top 5</h5>
                </div>
                <div class="admin-card-body">
                    <div style="position: relative; height: 260px;"><canvas id="routesChart"></canvas></div>
                </div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="admin-card h-100" style="margin-bottom: 0;">
                <div class="admin-card-header">
                    <h5><i class="bi bi-currency-exchange me-2"></i>월별 순매출 (최근 6개월)</h5>
                </div>
                <div class="admin-card-body">
                    <div style="position: relative; height: 260px;"><canvas id="revenueChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Route Table -->
    <div class="admin-card">
        <div class="admin-card-header">
            <h5><i class="bi bi-table me-2"></i>노선별 상세 통계 (확정 예약 Top 10)</h5>
        </div>
        <div class="admin-card-body" style="padding: 0; overflow-x: auto;">
            <table class="admin-table">
                <thead>
                <tr>
                    <th style="width: 60px;">순위</th>
                    <th>노선</th>
                    <th style="width: 100px;">예약 건수</th>
                    <th style="width: 140px;">총 매출</th>
                    <th style="width: 120px;">평균 단가</th>
                    <th style="width: 180px;">점유율</th>
                </tr>
                </thead>
                <tbody id="routeTableBody">
                <tr class="admin-table-empty">
                    <td colspan="6">조회된 데이터가 없습니다.</td>
                </tr>
                </tbody>
            </table>
            <template id="routeRowTemplate">
                <tr>
                    <td class="row-rank" style="text-align: center; font-weight: 700;"></td>
                    <td class="row-route"></td>
                    <td class="row-count" style="text-align: center;"></td>
                    <td class="row-revenue"></td>
                    <td class="row-avg"></td>
                    <td>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <div style="flex: 1; height: 8px; background: #ecf0f1; border-radius: 4px; overflow: hidden;">
                                <div class="row-share-bar" style="width: 0; height: 100%; background: #3498db;"></div>
                            </div>
                            <span class="row-share" style="font-size: 0.8rem; color: #7f8c8d; min-width: 40px;"></span>
                        </div>
                    </td>
                </tr>
            </template>
        </div>
    </div>
</th:block>

</html>
