plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

tasks.named('bootJar') {
    archiveBaseName = 'flight-booking-system'
}

group = 'io.miraclecat'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// 의존성 POM의 exclusion을 전역 적용하면 런타임에서 spring-web이 빠짐 → Gradle 기본 해석 사용
dependencyManagement {
    applyMavenExclusions = false
}

dependencies {
    /** 스프링부트 */
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-security-oauth2-client"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    providedRuntime "org.springframework.boot:spring-boot-starter-tomcat"
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    /** JPA */
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:6.10.1'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:6.10.1:jakarta'
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    /** Thymeleaf Layout Dialect Template */
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.3.0"
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6:3.1.1.RELEASE'   // sec:authorize (menu, admin sidebar)

    /** JWT (JWS + JWE) & Json */
    implementation 'com.nimbusds:nimbus-jose-jwt:10.0.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'tools.jackson.dataformat:jackson-dataformat-xml'

    /** Redis 커넥션 풀 (Lettuce) */
    implementation 'org.apache.commons:commons-pool2:2.12.0'

    /** 롬복 */
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor "org.projectlombok:lombok:1.18.46"

    /** Maria connector */
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.2'

    /** 스케줄러락 */
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.9.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.9.1'

    /** Swagger */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    /** Test */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mariadb'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}

tasks.named('test') {
    useJUnitPlatform()
}
